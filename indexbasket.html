<html>
    <head>
        <link rel="stylesheet" href="indexbasket.css">
    </head>
    <body>
        <div id="main">
            <div class="container">
                <div class="container-el">
                    <h1 class="title">HOME</h1>
                    <h2 id="home-el" class="score-box">12</h2>
                        <div class="btns">
                            <button onclick="homeAdd1()">+1</button>
                            <button onclick="homeAdd2()">+2</button>
                            <button onclick="homeAdd3()">+3</button>
                    </div>
                </div>
                <div class="container-el">
                    <h1 class="title">GUEST</h1>
                    <h2 id="guest-el" class="score-box">5</h2>
                        <div class="btns">
                            <button onclick="guestAdd1()">+1</button>
                            <button onclick="guestAdd2()">+2</button>
                            <button onclick="guestAdd3()">+3</button>
                        </div>
                </div>
            </div>
                 <button id="Game-btn" onclick="newGame()">New Game</button>
        </div>     
        <script src="indexbasket.js"></script>
    </body>
</html>
